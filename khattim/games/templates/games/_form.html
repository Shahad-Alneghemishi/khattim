<form method="post" {% if form.is_multipart %}enctype="multipart/form-data"{% endif %} class="space-y-4">
  {% csrf_token %}

  {% if form.non_field_errors %}
    <div class="rounded-md bg-red-100 px-4 py-3 text-sm text-red-800 dark:bg-red-900/40 dark:text-red-200">
      {% for error in form.non_field_errors %}
        <p>{{ error }}</p>
      {% endfor %}
    </div>
  {% endif %}

  {% for field in form %}
    <div>
      <label for="{{ field.id_for_label }}" class="mb-1 block text-sm font-medium">{{ field.label }}</label>
      {{ field }}

      {% if field.help_text %}
        <div class="mt-1 text-xs text-slate-500 dark:text-slate-400 [&_ul]:list-disc [&_ul]:ps-5 [&_ul]:space-y-0.5">{{ field.help_text }}</div>
      {% endif %}

      {% for error in field.errors %}
        <p class="mt-1 text-sm text-red-600 dark:text-red-400">{{ error }}</p>
      {% endfor %}
    </div>
  {% endfor %}

  <button type="submit" class="w-full rounded-md bg-indigo-600 px-4 py-2 text-sm font-medium text-white hover:bg-indigo-500">{{ submit_label|default:"Save" }}</button>
</form>
