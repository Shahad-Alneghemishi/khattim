{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Khattim{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
  <header>
    <a href="/" class="logo">Khattim</a>
    <nav>
      {% if user.is_authenticated %}
        <a href="{% url 'profile' %}">Profile</a>
      {% endif %}
    </nav>
  </header>

  <main>
    {% block content %}{% endblock %}
  </main>

  <footer>
    Game data from <a href="https://rawg.io" target="_blank" rel="noopener">RAWG</a>
  </footer>
</body>
</html>
