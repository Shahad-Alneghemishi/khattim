{% extends "games/base.html" %}
{% block title %}Register{% endblock %}

{% block content %}
  <div class="mx-auto max-w-md">
    <h1 class="mb-6 text-2xl font-bold">Create account</h1>
    <div class="rounded-lg border border-slate-200 bg-white p-6 shadow-sm dark:border-slate-800 dark:bg-slate-900">
      {% include "games/_form.html" with submit_label="Register" %}
    </div>
    <p class="mt-4 text-center text-sm text-slate-600 dark:text-slate-300">
      Already have an account? <a href="{% url 'login' %}" class="text-indigo-600 underline dark:text-indigo-400">Login</a>
    </p>
  </div>
{% endblock %}
