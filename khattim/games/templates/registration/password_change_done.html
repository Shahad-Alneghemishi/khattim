{% extends "games/base.html" %}
{% block title %}Password changed{% endblock %}

{% block content %}
  <div class="mx-auto max-w-md text-center">
    <div class="rounded-lg border border-slate-200 bg-white p-6 shadow-sm dark:border-slate-800 dark:bg-slate-900">
      <div class="text-4xl" aria-hidden="true">✅</div>
      <h1 class="mt-3 text-xl font-bold">Password changed</h1>
      <p class="mt-1 text-sm text-slate-600 dark:text-slate-300">Your password was updated successfully.</p>
      <a href="{% url 'profile' %}" class="mt-5 inline-block rounded-md bg-indigo-600 px-4 py-2 text-sm font-medium text-white hover:bg-indigo-500">Back to profile</a>
    </div>
  </div>
{% endblock %}
